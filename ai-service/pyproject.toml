[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scitrace-ai-engine"
version = "0.1.0"
description = "Microservicio de extracción y análisis orientativo de SciTrace AI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "pydantic-settings==2.16.1",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.32",
    "python-docx==1.2.0",
    "pymupdf==2.0",
    "pytesseract==0.3.13",
    "pillow==13.0.0",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "httpx==0.28.1",
    "rapidfuzz==3.10.1",
    "numpy<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
