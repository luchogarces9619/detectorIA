; Configuración de PHP para SciTrace AI (desarrollo y base para producción).
; En producción se recomienda desactivar opcache.validate_timestamps.

expose_php = Off
date.timezone = UTC
memory_limit = 256M
upload_max_filesize = 25M
post_max_size = 26M
max_execution_time = 120
max_input_time = 120
max_input_vars = 3000

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.save_comments = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600

session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; Nunca mostrar errores al cliente; Laravel los registra en storage/logs.
display_errors = Off
log_errors = On
