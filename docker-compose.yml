name: scitrace

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: scitrace/app:local
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      AI_SERVICE_URL: http://ai:8000
      MAIL_HOST: mailpit
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);\""]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 30s
    restart: unless-stopped
    networks:
      - scitrace

  web:
    image: nginx:1.30.6-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - scitrace

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: scitrace/app:local
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      AI_SERVICE_URL: http://ai:8000
      MAIL_HOST: mailpit
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--max-time=3600"]
    volumes:
      - ./src:/var/www/html
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - scitrace

  ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
      target: runtime
    image: scitrace/ai:local
    env_file:
      - .env
    environment:
      AI_ENVIRONMENT: ${AI_ENVIRONMENT:-local}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      AI_LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
      AI_DETECTOR_ENABLED: ${AI_DETECTOR_ENABLED:-true}
      AI_DETECTOR_READY: ${AI_DETECTOR_READY:-true}
      AI_MODEL_DIR: /app/models/scitrace-es-v1
      AI_MAX_DOCUMENT_BYTES: ${AI_MAX_DOCUMENT_BYTES:-26214400}
      AI_MAX_SEGMENTS: ${AI_MAX_SEGMENTS:-10000}
      AI_OCR_ENABLED: ${AI_OCR_ENABLED:-true}
      AI_OCR_LANGUAGES: ${AI_OCR_LANGUAGES:-spa+eng}
      AI_OCR_DPI: ${AI_OCR_DPI:-200}
      AI_MIN_TEXT_CHARS_PER_PAGE: ${AI_MIN_TEXT_CHARS_PER_PAGE:-20}
    expose:
      - "8000"
    # El artefacto se monta en solo lectura para poder actualizarlo sin
    # reconstruir la imagen. Si el directorio no existe o el SHA-256 no
    # coincide con card.json, /detect responde 503.
    volumes:
      - ./ai-service/models:/app/models:ro
    # Puerto de depuración accesible únicamente desde el host local.
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - scitrace

  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - scitrace

  redis:
    image: redis:8.8.3-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - scitrace

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
    networks:
      - scitrace

  # Suite de pruebas del microservicio (pytest + ruff).
  # Uso: docker compose --profile tools run --rm --build ai-tests
  ai-tests:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
      target: test
    image: scitrace/ai-tests:local
    env_file:
      - .env
    environment:
      AI_ENVIRONMENT: test
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
    profiles:
      - tools
    networks:
      - scitrace

  # Servicio de herramientas: compila los assets de Vite sobre el código del host.
  # Uso: docker compose --profile tools run --rm assets
  assets:
    image: node:24.22.1-alpine
    working_dir: /app
    volumes:
      - ./src:/app
    command: ["sh", "-c", "npm ci && npm run build"]
    profiles:
      - tools
    networks:
      - scitrace

networks:
  scitrace:
    driver: bridge

volumes:
  pgdata:
  redisdata:
